<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    .river-wrap {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }
    .river-wrap:active { cursor: grabbing; }
    .river-track {
      display: flex;
      height: 100%;
      width: max-content;
      will-change: transform;
    }
    .river-track img {
      height: 100%;
      width: auto;
      display: block;
      padding-right: 5px; /* Match your 5px gap */
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="river-wrap" id="wrap">
    <div class="river-track" id="track">
      <img src="river.jpg" alt="" />
      <img src="river.jpg" alt="" />
    </div>
  </div>

  <script>
    const wrap = document.getElementById('wrap');
    const track = document.getElementById('track');
    let pos = 0, speed = 0.6, isDragging = false, startX = 0, prevPos = 0;

    function step() {
      if (!isDragging) {
        pos -= speed;
        const half = track.scrollWidth / 2;
        if (Math.abs(pos) >= half) pos += half;
        track.style.transform = `translate3d(${pos}px, 0, 0)`;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);

    wrap.addEventListener('pointerdown', e => {
      isDragging = true;
      startX = e.clientX;
      prevPos = pos;
      wrap.setPointerCapture(e.pointerId);
    });
    wrap.addEventListener('pointermove', e => {
      if (!isDragging) return;
      const half = track.scrollWidth / 2;
      pos = prevPos + (e.clientX - startX);
      if (pos > 0) pos -= half;
      if (Math.abs(pos) >= half) pos += half;
      track.style.transform = `translate3d(${pos}px, 0, 0)`;
    });
    wrap.addEventListener('pointerup', () => isDragging = false);
  </script>
</body>
</html>
